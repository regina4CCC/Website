<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hello Mars. We will be there soon.</title>

  <!-- Loads the interactive 3D viewer -->
  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px;
      font-family: Arial, sans-serif;
      color: white;

      /* Dark overlay keeps the text readable over the photo */
      background-color: #151515;
      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.55),
          rgba(0, 0, 0, 0.75)
        ),
        url("mars.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 25px;
      background: rgba(15, 15, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
    }

    h1 {
      margin-top: 0;
    }

    .page-button,
    #mars-button {
      display: inline-block;
      margin: 10px 0;
      padding: 16px 28px;
      background: #b84321;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      text-decoration: none;
      cursor: pointer;
    }

    .page-button:hover,
    #mars-button:hover {
      background: #812e17;
    }

    .page-button:focus-visible,
    #mars-button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    #mars-section {
      margin-top: 20px;
      animation: appear 0.5s ease-out;
    }

    #mars-section[hidden] {
      display: none;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 450px;
      background: #080808;
      border: 1px solid #555;
      border-radius: 16px;
      touch-action: pan-y;
    }

    .instructions,
    .credit {
      line-height: 1.5;
    }

    .credit {
      color: #ddd;
      font-size: 14px;
    }

    #model-status {
      color: #ffd6a5;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      main {
        padding: 18px;
      }

      model-viewer {
        height: 350px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #mars-section {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Hello Mars. We will be there soon.</h1>

    <p>Explore the Red Planet in 3D.</p>

    <p>
      <a href="Interactivity.html" class="page-button">
        Explore Interactivity
      </a>
    </p>

    <button
      id="mars-button"
      type="button"
      aria-controls="mars-section"
      aria-expanded="false">
      Click to discover Mars!
    </button>

    <section id="mars-section" hidden>
      <h2>Explore Mars</h2>

      <!-- Change this src if your model has a different filename -->
      <model-viewer
        id="mars-model"
        src="mars.glb"
        alt="An interactive 3D model of Mars from NASA"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        loading="eager">
      </model-viewer>

      <p id="model-status" role="status">
        Loading Mars…
      </p>

      <p class="instructions">
        Drag to rotate Mars. Scroll or pinch to zoom.
      </p>

      <p class="credit">
        Mars model: NASA/JPL-Caltech.
      </p>
    </section>
  </main>

  <script>
    const marsButton = document.getElementById("mars-button");
    const marsSection = document.getElementById("mars-section");
    const marsModel = document.getElementById("mars-model");
    const modelStatus = document.getElementById("model-status");

    marsButton.addEventListener("click", function () {
      marsSection.hidden = false;
      marsButton.setAttribute("aria-expanded", "true");
      marsButton.hidden = true;
    });

    marsModel.addEventListener("load", function () {
      modelStatus.textContent = "Mars is ready to explore!";
    });

    marsModel.addEventListener("error", function () {
      modelStatus.textContent =
        "The Mars model could not load. Check the model filename " +
        "and make sure its files are uploaded beside index.html.";
    });

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      marsModel.removeAttribute("auto-rotate");
    }
  </script>
</body>
</html>
