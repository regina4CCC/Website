<!doctype html>
<html>
  <head>
    <title>Hello Mars. We will be there soon.</title>
  </head>
</html>
<!-- The button visitors see first -->
<button id="mars-button" type="button">
  Click to discover Mars!
</button>

<style>
  #mars-button {
    padding: 18px 30px;
    background: #b84321;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }

  #mars-button:hover {
    background: #913218;
    transform: scale(1.05);
  }

  .mars-photo {
    display: block;
    width: 350px;
    max-width: 100%;
    height: auto;
    border-radius: 16px;
    animation: appear 0.5s ease-out;
  }

  @keyframes appear {
    from {
      opacity: 0;
      transform: scale(0.7);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }
</style>

<script>
  const marsButton = document.getElementById("mars-button");

  marsButton.addEventListener("click", function () {
    const marsPhoto = document.createElement("img");

    marsPhoto.src = "mars.jpg";
    marsPhoto.alt = "A photograph of Mars";
    marsPhoto.className = "mars-photo";

    marsButton.replaceWith(marsPhoto);
  });
</script>
